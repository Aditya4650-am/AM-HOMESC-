name: Build Homescapes Client EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the web app still builds and passes its tests
        # The EXE only wraps the UI, so a broken bundle or a broken engine would
        # ship inside a green release. Check before packaging.
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test
          npm run build

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Build EXE (PyInstaller onedir)
        run: |
          cd client
          python -m PyInstaller --clean --noconfirm homescapes_client.spec

      - name: Verify GUI subsystem
        shell: pwsh
        run: |
          $pe = "client/dist/Homescapes Save Studio/Homescapes Save Studio.exe"
          $bytes = [System.IO.File]::ReadAllBytes($pe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "Expected GUI (2), got $subsystem" }

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path 'client/dist/Homescapes Save Studio' -DestinationPath 'client/dist/HOMESC.SAVE.STUDIO.zip' -Force

      - name: Publish SHA-256 next to the asset
        # `hc update` refuses to replace the running EXE without this file, so it
        # has to be produced by the same job that builds the zip.
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'client/dist/HOMESC.SAVE.STUDIO.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256: $hash"
          "$hash  HOMESC.SAVE.STUDIO.zip" | Out-File -Encoding ascii 'client/dist/HOMESC.SAVE.STUDIO.zip.sha256'
          Get-Content 'client/dist/HOMESC.SAVE.STUDIO.zip.sha256'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: homescapes-client
          path: client/dist/HOMESC.SAVE.STUDIO.zip

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/dist/HOMESC.SAVE.STUDIO.zip
            client/dist/HOMESC.SAVE.STUDIO.zip.sha256