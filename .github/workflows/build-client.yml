name: Build Homescapes Client EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the web app still builds and passes its tests
        # The EXE only wraps the UI, so a broken bundle or a broken engine would
        # ship inside a green release. Check before packaging.
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test
          npm run build

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Bundle ADB (so Connect works on a clean client PC)
        # A client installs the EXE and nothing else. Without platform-tools
        # beside it `_find_adb()` has to guess an emulator path and Connect
        # fails on a machine that never installed the Android SDK. Google's
        # official zip is not redistributable from this repo, so it is fetched
        # here and packed into the build instead of being committed.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\platform-tools.zip" -UseBasicParsing
          Expand-Archive -Path "$env:RUNNER_TEMP\platform-tools.zip" -DestinationPath "$env:RUNNER_TEMP\pt" -Force
          New-Item -ItemType Directory -Force -Path 'client/adb' | Out-Null
          foreach ($f in @('adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll')) {
            Copy-Item "$env:RUNNER_TEMP\pt\platform-tools\$f" -Destination 'client/adb' -Force
          }
          & 'client/adb/adb.exe' version
          Get-ChildItem 'client/adb' | Select-Object Name,Length

      - name: Build EXE (PyInstaller onedir)
        run: |
          cd client
          python -m PyInstaller --clean --noconfirm homescapes_client.spec

      - name: Verify ADB actually shipped inside the build
        shell: pwsh
        run: |
          $bundled = 'client/dist/Homescapes Save Studio/_internal/adb/adb.exe'
          if (-not (Test-Path $bundled)) {
            $hit = Get-ChildItem -Path 'client/dist/Homescapes Save Studio' -Recurse -Filter 'adb.exe' | Select-Object -First 1
            if (-not $hit) { throw 'adb.exe is not in the packaged build - Connect would fail on a clean PC' }
            $bundled = $hit.FullName
          }
          Write-Host "bundled adb: $bundled"
          & $bundled version

      - name: Verify GUI subsystem
        shell: pwsh
        run: |
          $pe = "client/dist/Homescapes Save Studio/Homescapes Save Studio.exe"
          $bytes = [System.IO.File]::ReadAllBytes($pe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "Expected GUI (2), got $subsystem" }

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path 'client/dist/Homescapes Save Studio' -DestinationPath 'client/dist/HOMESC.SAVE.STUDIO.zip' -Force

      - name: Publish SHA-256 next to the asset
        # `hc update` refuses to replace the running EXE without this file, so it
        # has to be produced by the same job that builds the zip.
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'client/dist/HOMESC.SAVE.STUDIO.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256: $hash"
          "$hash  HOMESC.SAVE.STUDIO.zip" | Out-File -Encoding ascii 'client/dist/HOMESC.SAVE.STUDIO.zip.sha256'
          Get-Content 'client/dist/HOMESC.SAVE.STUDIO.zip.sha256'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: homescapes-client
          path: client/dist/HOMESC.SAVE.STUDIO.zip

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/dist/HOMESC.SAVE.STUDIO.zip
            client/dist/HOMESC.SAVE.STUDIO.zip.sha256