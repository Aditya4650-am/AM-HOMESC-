# Render Blueprint — Homescapes Save Studio (web service).
#
# Render injects PORT; src/server/main.ts listens on 0.0.0.0 whenever PORT is
# set, so no manual host/port editing is needed. The build produces ./dist,
# which the same Node process serves alongside /api/*.
#
# HS_MASTER turns the login on: every /api route except /api/health and
# /api/license/* then needs an activated key. Leave it unset for a local run
# with no gate. DATABASE_URL keeps issued keys across restarts — without it the
# file store in data/ is wiped by every deploy and free-plan spin-down.
services:
  - type: web
    name: homescapes-save-studio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HS_MASTER
        sync: false
      - key: HS_OWNER
        sync: false
      - key: DATABASE_URL
        sync: false
      # Desktop EXE self-update. OPTIONAL — the server resolves the release
      # channel itself from GitHub (build-client.yml attaches the zip + its
      # .sha256 to every v* tag), so leaving these empty is the normal,
      # zero-maintenance setup: tag a release and installed EXEs update on
      # their next poll. Only set them to pin/offline-fallback a specific
      # build when GitHub is unreachable; Owner Hub -> Publish update
      # overrides both at runtime.
      - key: CLIENT_VERSION
        sync: false
      - key: CLIENT_UPDATE_URL
        sync: false
      - key: CLIENT_UPDATE_SHA256
        sync: false
      - key: CLIENT_UPDATE_NOTES
        sync: false
